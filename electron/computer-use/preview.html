<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>飞书 · 实时画面</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <header><div class="identity"><span class="icon">飞</span><div><strong>飞书</strong><small>电脑操作</small></div></div><span id="status" role="status">尚未连接</span></header>
  <main>
    <img id="screen" alt="飞书实时画面" hidden>
    <div id="placeholder"><span class="symbol">↗</span><h1>跟随工作进展</h1><p id="message">连接飞书，查看应用中的实时画面。</p><button id="connect">连接飞书</button><button id="settings" class="secondary" hidden>打开系统设置</button></div>
  </main>
  <footer><span id="detail">画面与飞书客户端保持同步</span><button id="disconnect" class="secondary" hidden>断开预览</button></footer>
  <script src="preview-renderer.js"></script>
</body>
</html>
